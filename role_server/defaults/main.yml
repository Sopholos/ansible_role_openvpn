---
openvpn_server_admin_user: ovpn

openvpn_server_root_path: "~/ovpn-data"

openvpn_server_compose_path: "~/ovpn-data/openvpn-stack"

openvpn_server_fw_rules_sh_path: "{{ openvpn_server_root_path }}/fw-rules.sh"
openvpn_server_fw_rules: ""
openvpn_server_conf_path: "{{ openvpn_server_root_path }}/server.conf"

openvpn_server_ui_port: 8080
openvpn_server_vpn_port: 1194
openvpn_server_vpn_port_proto: tcp

openvpn_server_compose:
  # version: "3.5"
  services:
    openvpn:
      image: d3vilh/openvpn-server:latest
      container_name: openvpn
      privileged: true
      ports:
        - "{{ openvpn_server_vpn_port }}:1194/udp"
        - "{{ openvpn_server_vpn_port }}:1194/tcp"
      environment:
        INTERFACE: eth0
        TRUST_SUB: 10.0.70.0/24
        GUEST_SUB: 10.0.71.0/24
        HOME_SUB: 192.168.88.0/24
      volumes:
        - "{{ openvpn_server_root_path }}/pki:/etc/openvpn/pki"
        - "{{ openvpn_server_root_path }}/clients:/etc/openvpn/clients"
        - "{{ openvpn_server_root_path }}/config:/etc/openvpn/config"
        - "{{ openvpn_server_root_path }}/staticclients:/etc/openvpn/staticclients"
        - "{{ openvpn_server_root_path }}/log:/var/log/openvpn"
        - "{{ openvpn_server_fw_rules_sh_path }}:/opt/app/fw-rules.sh"
        - "{{ openvpn_server_conf_path }}/:/etc/openvpn/server.conf"
      cap_add:
        - NET_ADMIN
      restart: always
      devices:
        - "/dev/net/tun:/dev/net/tun"

    openvpn-ui:
      image: d3vilh/openvpn-ui:latest
      container_name: openvpn-ui
      depends_on:
        - openvpn
      privileged: true
      ports:
        - "{{ openvpn_server_ui_port }}:8080"
      volumes:
        - "{{ openvpn_server_root_path }}/:/etc/openvpn"
        - "{{ openvpn_server_root_path }}/db:/opt/openvpn-ui/db"
        - "{{ openvpn_server_root_path }}/pki:/usr/share/easy-rsa/pki"
        - "{{ openvpn_server_root_path }}/var/run/docker.sock:/var/run/docker.sock:ro"
      environment:
        - "OPENVPN_ADMIN_USERNAME={{ openvpn_server_admin_user }}"
        - "OPENVPN_ADMIN_PASSWORD={{ openvpn_server_admin_password }}"
      restart: always

openvpn_server_client_conf: |-
  client
  dev tun
  proto {{ openvpn_server_vpn_port_proto }}
  remote ov.sopholos.ru {{ openvpn_server_vpn_port }} {{ openvpn_server_vpn_port_proto }}
  resolv-retry infinite
  user nobody
  group nogroup
  persist-tun
  persist-key
  remote-cert-tls server
  cipher AES-256-GCM
  auth SHA512
  auth-nocache
  tls-client
  # redirect-gateway def1
  verb 3
   
  #Custom Option One
  #Custom Option Two
  #Custom Option Three
  <ca>

  </ca>
  <cert>

  </cert>
  <key>

  </key>
  <tls-crypt>

  </tls-crypt>
  # Auto generated by OpenVPN-UI v.0.9.5.6

openvpn_server_easy_rsa_vars: |-
  set_var EASYRSA_DN           "org"
  set_var EASYRSA_REQ_COUNTRY  "RO"
  set_var EASYRSA_REQ_PROVINCE "PM"
  set_var EASYRSA_REQ_CITY     "Pm"
  set_var EASYRSA_REQ_ORG      "SweetHome"
  set_var EASYRSA_REQ_EMAIL    "sweet@home.net"
  set_var EASYRSA_REQ_OU       "MyOrganizationalUnit"
  set_var EASYRSA_REQ_CN       "server"
  set_var EASYRSA_KEY_SIZE     2048
  set_var EASYRSA_CA_EXPIRE    3650
  set_var EASYRSA_CERT_EXPIRE  825
  set_var EASYRSA_CERT_RENEW   30
  set_var EASYRSA_CRL_DAYS     180
  # Auto generated by OpenVPN-UI v.0.9.5.6


openvpn_server_server_conf : |
  management 0.0.0.0 2080  # Don't change this line. OpenVPN UI uses this feature to manage the server 

  dev tun
  port 1194
  proto {{ openvpn_server_vpn_port_proto }}

  topology subnet
  keepalive 10 120
  max-clients 100

  persist-key
  persist-tun
  explicit-exit-notify 1

  user nobody
  group nogroup

  client-config-dir /etc/openvpn/staticclients
  ifconfig-pool-persist pki/ipp.txt

  ca pki/ca.crt
  cert pki/issued/server.crt
  key pki/private/server.key
  crl-verify pki/crl.pem
  dh pki/dh.pem

  tls-crypt pki/ta.key
  tls-version-min 1.2
  remote-cert-tls client

  cipher AES-256-GCM
  # ncp-ciphers AES-256-GCM:AES-192-GCM:AES-128-GCM   # Deprecated since ver. 0.9.3. We have to use data-ciphers below instead
  data-ciphers AES-256-GCM:AES-192-GCM:AES-128-GCM

  auth SHA512

  server 10.0.70.0 255.255.255.0           # Trusted VPN subnet
  route 10.0.71.0 255.255.255.0            # Route to Guest VPN subnet
  push "route 10.0.60.0 255.255.255.0"     # Route to Home VPN subnet
  push "dhcp-option DNS 8.8.8.8"             # DNS1 server for VPN clients
  push "dhcp-option DNS 1.0.0.1"             # DNS2 server for VPN clients
  push "redirect-gateway def1 bypass-dhcp"    # Redirect gateway for VPN clients

  log /var/log/openvpn/openvpn.log
  verb 3
  status /var/log/openvpn/openvpn-status.log
  status-version 2




  # Custom Option One
  duplicate-cn
  # Custom Option Two
  # client-to-client
  # Custom Option Three
  # push "route 0.0.0.0 255.255.255.255 net_gateway"
  # push block-outside-dns

  # Auto generated by OpenVPN-UI v.0.9.5.6
